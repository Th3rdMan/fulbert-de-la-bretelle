# Régénère les pages HTML (prérendu lisible sans JavaScript et aperçus de
# partage) dès qu'un fichier de données ou de rendu change sur main.
name: Prérendu des pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/js/**"
      - "outils/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerendu
  cancel-in-progress: false

jobs:
  prerendu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node outils/prerendu.js
      - name: Enregistrer les pages régénérées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -- *.html
          if git diff --cached --quiet; then
            echo "Pages déjà à jour."
          else
            git commit -m "Prérendu des pages"
            git push
          fi
